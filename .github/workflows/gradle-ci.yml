name: Gradle Verify

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up canonical JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Validate canonical version files
        shell: bash
        run: |
          set -euo pipefail
          test -f gradle/libs.versions.toml
          test -f gradle/tools.versions.toml
          grep -Eq '^jdk[[:space:]]*=[[:space:]]*"17"' gradle/tools.versions.toml

      - name: Build all non-device targets
        run: ./gradlew --no-daemon --stacktrace clean build -x :app:connectedAndroidTest

      - name: Lint app
        run: ./gradlew --no-daemon --stacktrace :app:lint

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-diagnostics
          path: |
            **/build/reports/**
            **/build/test-results/**
            app/build/outputs/**
          if-no-files-found: warn
          retention-days: 30
